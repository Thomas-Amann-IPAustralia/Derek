name: Corpus snapshot

# The requirement is that the offline snapshot tracks the live Style Manual
# within 3 days. A DAILY schedule gives three independent attempts inside
# that window, which absorbs GitHub's occasional dropping of scheduled runs.
#
# Octavius ran this monthly (`0 0 1 * *`) — worst-case staleness of 31 days
# against a 3-day requirement (postmortem F7).
#
# `--sweep-slice` re-hashes 1/7th of the corpus each day regardless of what
# the sitemap's `lastmod` claims, so every page is verified weekly. That is
# the only thing that catches a silent upstream edit (ADR-001).

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch and re-hash every page"
        type: boolean
        default: false
  schedule:
    - cron: '17 15 * * *'   # 01:17 AEST / 02:17 AEDT, daily

permissions:
  contents: write

# Everything that writes ledger/rules.jsonl shares one concurrency group.
# snapshot.yml reconciles the ledger against a fresh corpus; apply-review.yml
# replays reviewer decisions into it. They were in separate groups, so the two
# could run at once, each checking out, rewriting the whole file and pushing —
# and whichever pushed second would either be rejected or silently land a
# ledger built without the other's changes. The group is named for the
# resource, not the workflow, so anything added later joins it by saying so.
concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - uses: browser-actions/setup-chrome@v1

      - run: pip install -r requirements-pipeline.txt

      - name: Pick today's sweep slice
        id: slice
        run: echo "n=$(( $(date -u +%j) % 7 ))" >> "$GITHUB_OUTPUT"

      - name: Snapshot the Style Manual
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python -m derek.corpus.snapshot --full
          else
            python -m derek.corpus.snapshot --sweep-slice "${{ steps.slice.outputs.n }}"
          fi

      # While corpus/freeze.yaml declares a freeze, the snapshot above wrote no
      # pages and no lock, so there is nothing for the reconciler to reconcile —
      # and rebuilding would be worse than pointless: it would move rule UIDs
      # under the spans the annotator is recording against them (ADR-024).
      - name: Is the corpus frozen?
        id: freeze
        run: |
          if python -c "import sys; from derek.corpus.freeze import load_freeze; sys.exit(0 if load_freeze() else 1)"; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            python -c "from derek.corpus.freeze import load_freeze; print(load_freeze().banner())"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile rules against the new corpus
        if: steps.freeze.outputs.frozen == 'false'
        run: python -m derek.extract.build

      - name: Commit
        id: commit
        run: |
          git config user.name  "DerekBot"
          git config user.email "derek-bot@users.noreply.github.com"
          git add corpus/ ledger/
          if git diff --cached --quiet; then
            echo "No corpus change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "corpus: snapshot $(date -u +%Y-%m-%d)"
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Corpus snapshot"
            if [ "${{ steps.freeze.outputs.frozen }}" = "true" ]; then
              python -c "from derek.corpus.freeze import load_freeze; print(load_freeze().banner())"
              echo
              echo "Drift from the frozen corpus:"
              echo '```json'
              head -40 corpus/drift.json 2>/dev/null || echo "{}"
              echo '```'
            else
              latest=$(ls -1t corpus/changes/*.json 2>/dev/null | head -1)
              if [ -n "$latest" ]; then
                echo '```json'; cat "$latest" | head -40; echo '```'
              else
                echo "No changes this run."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A reconciled ledger that nobody can see is half a snapshot. The push above
  # was made with GITHUB_TOKEN, which does not trigger another workflow, so the
  # published dashboard is rebuilt from here.
  publish:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
